<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista conjunta</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f1f1c;--mu:#75736b;--ac:#2f6f5e;--acx:#fff;--bd:#e2e0d8;--er:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--card:#222320;--tx:#ecebe5;--mu:#9a988e;--ac:#5fb59f;--acx:#10201b;--bd:#34352f;--er:#e57a70}}
:root[data-theme="dark"]{--bg:#171815;--card:#222320;--tx:#ecebe5;--mu:#9a988e;--ac:#5fb59f;--acx:#10201b;--bd:#34352f;--er:#e57a70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--acx);cursor:pointer}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button.link{background:none;color:var(--ac);padding:4px 0;text-decoration:underline}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;background:transparent;color:var(--mu);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.err{color:var(--er);font-size:.9rem;margin:10px 0 0;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.who{font-size:.9rem;color:var(--mu)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
li:last-child{border:0}
li input{margin-top:4px;width:20px;height:20px;accent-color:var(--ac)}
.t{flex:1;word-break:break-word}
.done .t span:first-child{text-decoration:line-through;color:var(--mu)}
.by{display:block;font-size:.78rem;color:var(--mu)}
.x{background:none;color:var(--mu);padding:2px 8px;font-size:1.2rem}
.pill{font-size:.75rem;border:1px solid var(--bd);border-radius:20px;padding:2px 8px;color:var(--mu)}.code{font:600 1.2rem ui-monospace,monospace;letter-spacing:.15em;color:var(--ac)}select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}.ico{width:1.2em;height:1.2em;vertical-align:-.2em;color:var(--ac)}h2{font-size:1.05rem;margin:0 0 10px}.lnk{cursor:pointer}.empty,.note{color:var(--mu);font-size:.9rem;text-align:center;padding:10px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg> Listas conjuntas</h1>
<div id="msg" class="note">Conectando…</div>

<section id="auth" class="card" hidden>
  <div class="tabs"><button id="tLogin" class="on" type="button">Entrar</button><button id="tReg" type="button">Crear cuenta</button></div>
  <label for="u">Usuario</label>
  <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
  <div id="dnWrap" hidden>
    <label for="dn">Nombre visible (puede ser distinto del usuario)</label>
    <input id="dn" type="text" maxlength="30">
  </div>
  <label for="p">Contraseña</label>
  <input id="p" type="password" autocomplete="current-password">
  <p id="aerr" class="err"></p>
  <button id="go" type="button" style="width:100%">Entrar</button>
</section>

<section id="app" hidden>
  <div class="top">
    <span class="who">Hola, <b id="me"></b></span>
    <span><button id="ren" class="ghost" type="button">Ajustes</button> <button id="out" class="ghost" type="button">Salir</button></span>
  </div>

  <div id="acct" class="card" hidden></div>

  <div id="home">
    <div class="card"><h2>Mis listas</h2><ul id="myLists"></ul><div id="noLists" class="empty">Aún no estás en ninguna lista.</div></div>
    <div class="card"><h2>Crear lista</h2>
      <div class="row"><input id="newName" type="text" placeholder="Nombre de la lista" maxlength="40"><button id="create" type="button">Crear</button></div></div>
    <div class="card"><h2>Unirse con código</h2>
      <div class="row"><input id="joinCode" type="text" placeholder="Código" maxlength="8" autocapitalize="characters"><button id="join" type="button">Unirse</button></div>
      <p id="herr" class="err"></p></div>
  </div>

  <div id="listv" hidden>
    <div class="top"><button id="back" class="ghost" type="button">← Listas</button><button id="cfg" class="ghost" type="button" hidden>⚙ Ajustes</button></div>
    <div class="card">
      <div class="top" style="margin:0"><h2 id="lname" style="margin:0"></h2><span id="lrole" class="pill"></span></div>
      <p class="who" style="margin:8px 0 0">Código para compartir: <span id="lcode" class="code"></span> <button id="copy" class="link" type="button">Copiar</button></p>
    </div>
    <div id="settings" class="card" hidden></div>
    <div id="addCard" class="card"><div class="row"><input id="nt" type="text" placeholder="Añadir a la lista…" maxlength="200"><button id="add" type="button">Añadir</button></div><p id="lerr" class="err"></p></div>
    <div class="card"><ul id="list"></ul><div id="empty" class="empty">La lista está vacía.</div></div>
  </div>
</section>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const h=(t,p={},...c)=>{const e=document.createElement(t);for(const k in p){if(k==='on')for(const ev in p.on)e.addEventListener(ev,p.on[ev]);else if(k==='cls')e.className=p[k];else e[k]=p[k]}e.append(...c);return e};
let db=null,mode='login',session=null,ready=false,cur=null,showCfg=false;
let profiles={},acctOpen=false,confirmDel=false,prefs={theme:'auto',style:'classic'},lists={},members=[],items=[];
const enc=new TextEncoder();
const ROLE={owner:'Propietario',write:'Puede escribir',read:'Solo lectura',pending:'Pendiente'};

function lsGet(){try{return JSON.parse(localStorage.getItem('lc_session')||'null')}catch(e){return null}}
function lsSet(v){try{v?localStorage.setItem('lc_session',JSON.stringify(v)):localStorage.removeItem('lc_session')}catch(e){}}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,saltHex){
  const salt=Uint8Array.from(saltHex.match(/../g).map(x=>parseInt(x,16)));
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256));
}
const normUser=s=>s.trim().toLowerCase();
const validUser=s=>/^[a-z0-9_.-]{3,24}$/.test(s);
const nameOf=u=>(profiles[u]&&profiles[u].display)||'Alguien';
const sha=async t=>hex(await crypto.subtle.digest('SHA-256',enc.encode(t)));
const STY={classic:['Clásico',['#2f6f5e','#ffffff'],['#5fb59f','#10201b']],verde:['Verde',['#2e9e44','#ffffff'],['#5dd37a','#0d2414']],rosa:['Rosa',['#d6457f','#ffffff'],['#f07aa6','#2b0f1a']],azul:['Azul',['#2f6fd0','#ffffff'],['#7aa8f0','#0e1a2e']]};
function applyPrefs(){const r=document.documentElement,t=prefs.theme;t==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t);const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches),c=(STY[prefs.style]||STY.classic)[dark?2:1];r.style.setProperty('--ac',c[0]);r.style.setProperty('--acx',c[1]);try{localStorage.setItem('lc_prefs',JSON.stringify(prefs))}catch(e){}}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyPrefs);
const mid=(c,u)=>c+':'+u;
const myMember=c=>members.find(m=>m.code===c&&m.user===session.uid);

function setMode(m){mode=m;$('tLogin').classList.toggle('on',m==='login');$('tReg').classList.toggle('on',m==='reg');$('dnWrap').hidden=m!=='reg';$('go').textContent=m==='login'?'Entrar':'Crear cuenta';$('aerr').textContent=''}

async function submitAuth(){
  const err=$('aerr');err.textContent='';
  const user=normUser($('u').value),pw=$('p').value;
  if(!validUser(user)){err.textContent='El usuario debe tener 3–24 caracteres: letras, números, punto, guion o guion bajo.';return}
  if(pw.length<6){err.textContent='La contraseña debe tener al menos 6 caracteres.';return}
  $('go').disabled=true;
  try{
    const key=await sha('lc:'+user),ref=db.collection('logins').doc(key),snap=await ref.get();
    if(mode==='reg'){
      if(snap.exists){err.textContent='Ese usuario ya existe.';return}
      const salt=hex(crypto.getRandomValues(new Uint8Array(16))),hash=await hashPw(pw,salt),uid=hex(crypto.getRandomValues(new Uint8Array(8)));
      await ref.set({uid,salt,hash,created:Date.now()});
      await db.collection('profiles').doc(uid).set({display:$('dn').value.trim().slice(0,30)||user,theme:prefs.theme,style:prefs.style});
      session={uid,key,hash};
    }else{
      if(!snap.exists){err.textContent='Usuario o contraseña incorrectos.';return}
      const d=snap.data(),hash=await hashPw(pw,d.salt);
      if(hash!==d.hash){err.textContent='Usuario o contraseña incorrectos.';return}
      session={uid:d.uid,key,hash};
    }
    lsSet(session);$('p').value='';render();
  }catch(e){err.textContent='No se pudo completar la operación. Inténtalo de nuevo.'}
  finally{$('go').disabled=false}
}

function openAcct(){
  acctOpen=true;const b=$('acct');b.textContent='';const pr=profiles[session.uid]||{};
  const msg=h('p',{cls:'err'});
  const dn=h('input',{type:'text',value:pr.display||'',maxlength:30});
  const sel=(opts,cur,fn)=>{const e=h('select',{style:'width:100%;padding:10px'});opts.forEach(([v,t])=>e.append(h('option',{value:v,selected:v===cur},t)));e.onchange=()=>fn(e.value);return e};
  const save=patch=>db.collection('profiles').doc(session.uid).update(patch).catch(()=>{msg.textContent='No se pudo guardar.'});
  const th=sel([['auto','Automático'],['light','Claro'],['dark','Oscuro']],prefs.theme,v=>{prefs.theme=v;applyPrefs();save({theme:v})});
  const st=sel(Object.entries(STY).map(([k,v])=>[k,v[0]]),prefs.style,v=>{prefs.style=v;applyPrefs();save({style:v})});
  const cp=h('input',{type:'password',autocomplete:'current-password'}),np=h('input',{type:'password',autocomplete:'new-password'});
  b.append(h('h2',{},'Ajustes'),
    h('label',{},'Nombre visible'),h('div',{cls:'row'},dn,h('button',{onclick:async()=>{const n=dn.value.trim();if(!n){msg.textContent='El nombre no puede estar vacío.';return}await save({display:n.slice(0,30)});msg.textContent='Nombre guardado.'}},'Guardar')),
    h('label',{},'Tema'),th,h('label',{},'Estilo'),st,
    h('label',{},'Cambiar contraseña'),h('div',{style:'display:grid;gap:8px'},h('div',{},'Actual',cp),h('div',{},'Nueva (mínimo 6 caracteres)',np),h('button',{onclick:async()=>{
      if(np.value.length<6){msg.textContent='La nueva contraseña debe tener al menos 6 caracteres.';return}
      try{const ref=db.collection('logins').doc(session.key),d=(await ref.get()).data();
        if(await hashPw(cp.value,d.salt)!==d.hash){msg.textContent='La contraseña actual no es correcta.';return}
        const salt=hex(crypto.getRandomValues(new Uint8Array(16))),hash=await hashPw(np.value,salt);
        await ref.update({salt,hash});session.hash=hash;lsSet(session);cp.value='';np.value='';msg.textContent='Contraseña actualizada.'}
      catch(e){msg.textContent='No se pudo cambiar la contraseña.'}}},'Cambiar contraseña')),
    msg,h('button',{cls:'ghost',onclick:()=>{acctOpen=false;render()}},'Cerrar'));
  render();
}

async function createList(){
  const name=$('newName').value.trim();$('herr').textContent='';
  if(!name)return;
  try{
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code,tries=0;
    do{code=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>A[b%A.length]).join('');tries++}while(lists[code]&&tries<10);
    await db.collection('lists').doc(code).set({name,owner:session.uid,approval:false,defaultRole:'write',created:Date.now()});
    await db.collection('members').doc(mid(code,session.uid)).set({code,user:session.uid,role:'owner',ts:Date.now()});
    $('newName').value='';cur=code;showCfg=false;render();
  }catch(e){$('herr').textContent='No se pudo crear la lista.'}
}

async function joinList(){
  const code=$('joinCode').value.trim().toUpperCase();$('herr').textContent='';
  if(!code)return;
  try{
    const l=await db.collection('lists').doc(code).get();
    if(!l.exists){$('herr').textContent='No existe ninguna lista con ese código.';return}
    const ex=await db.collection('members').doc(mid(code,session.uid)).get();
    if(!ex.exists){
      const d=l.data(),role=d.approval?'pending':(d.defaultRole||'write');
      await db.collection('members').doc(mid(code,session.uid)).set({code,user:session.uid,role,ts:Date.now()});
      if(role==='pending')$('herr').textContent='Solicitud enviada. El propietario debe aceptarla.';
    }
    $('joinCode').value='';
  }catch(e){$('herr').textContent='No se pudo unir a la lista.'}
}

function renderHome(){
  const ul=$('myLists');ul.textContent='';
  const mine=members.filter(m=>m.user===session.uid&&lists[m.code]);
  mine.forEach(m=>{
    const li=h('li',{},h('div',{cls:'t'},h('span',{},lists[m.code].name),h('span',{cls:'by'},m.role==='pending'?'Pendiente de aprobación':ROLE[m.role]+' · '+m.code)));
    if(m.role==='pending')li.append(h('button',{cls:'ghost',onclick:()=>db.collection('members').doc(mid(m.code,m.user)).delete()},'Cancelar'));
    else li.append(h('button',{on:{click:()=>{cur=m.code;showCfg=false;render()}}},'Abrir'));
    ul.append(li);
  });
  $('noLists').hidden=mine.length>0;
}

function renderList(){
  const l=lists[cur],m=myMember(cur);
  if(!l||!m||m.role==='pending'){cur=null;render();return}
  const owner=m.role==='owner',canW=owner||m.role==='write';
  $('lname').textContent=l.name;$('lrole').textContent=ROLE[m.role];$('lcode').textContent=cur;
  $('cfg').hidden=false;$('cfg').textContent=owner?'⚙ Lista':'Salir de la lista';
  $('addCard').hidden=!canW;
  $('settings').hidden=!showCfg;
  if(showCfg){owner?renderSettings(l):renderLeave()}
  const ul=$('list');ul.textContent='';
  const its=items.filter(i=>i.list===cur);
  its.forEach(it=>{
    const cb=h('input',{type:'checkbox',checked:!!it.done,disabled:!canW});
    cb.onchange=()=>db.collection('items').doc(it.id).update({done:cb.checked}).catch(()=>{});
    const li=h('li',{cls:it.done?'done':''},cb,h('div',{cls:'t'},h('span',{},it.text),h('span',{cls:'by'},'Añadido por '+nameOf(it.by))));
    if(canW)li.append(h('button',{cls:'x',title:'Eliminar',onclick:()=>db.collection('items').doc(it.id).delete().catch(()=>{})},'×'));
    ul.append(li);
  });
  $('empty').hidden=its.length>0;
}

function renderSettings(l){
  const box=$('settings');box.textContent='';
  box.append(h('h2',{},'Ajustes de la lista'));
  const ap=h('input',{type:'checkbox',checked:!!l.approval});
  ap.onchange=()=>db.collection('lists').doc(cur).update({approval:ap.checked});
  box.append(h('label',{style:'display:flex;gap:8px;align-items:center;color:var(--tx)'},ap,'Exigir aprobación para unirse'));
  const dr=h('select',{});
  [['write','Puede escribir'],['read','Solo lectura']].forEach(([v,t])=>dr.append(h('option',{value:v,selected:(l.defaultRole||'write')===v},t)));
  dr.onchange=()=>db.collection('lists').doc(cur).update({defaultRole:dr.value});
  box.append(h('label',{},'Permiso al unirse sin aprobación'),dr,h('label',{},'Personas'));
  const ul=h('ul',{});
  const ms=members.filter(m=>m.code===cur).sort((a,b)=>(a.role==='pending'?-1:0)-(b.role==='pending'?-1:0));
  ms.forEach(m=>{
    const name=h('div',{cls:'t'},h('span',{},nameOf(m.user)),h('span',{cls:'by'},ROLE[m.role]));
    const li=h('li',{},name);
    const ref=db.collection('members').doc(mid(cur,m.user));
    if(m.role==='owner')li.append(h('span',{cls:'pill'},ROLE.owner));
    else if(m.role==='pending')li.append(h('button',{onclick:()=>ref.update({role:l.defaultRole||'write'})},'Aceptar'),h('button',{cls:'ghost',onclick:()=>ref.delete()},'Rechazar'));
    else{
      const sel=h('select',{});
      [['write','Escribir'],['read','Leer']].forEach(([v,t])=>sel.append(h('option',{value:v,selected:m.role===v},t)));
      sel.onchange=()=>ref.update({role:sel.value});
      li.append(sel,h('button',{cls:'x',title:'Quitar',onclick:()=>ref.delete()},'×'));
    }
    ul.append(li);
  });
  box.append(ul,confirmDel?h('div',{style:'margin-top:12px'},h('p',{cls:'err'},'¿Eliminar la lista y todo su contenido?'),h('button',{style:'background:var(--er);color:#fff',onclick:delList},'Sí, eliminar'),' ',h('button',{cls:'ghost',onclick:()=>{confirmDel=false;render()}},'Cancelar')):h('button',{cls:'ghost',style:'margin-top:12px;color:var(--er)',onclick:()=>{confirmDel=true;render()}},'Eliminar lista'));
}

function renderLeave(){
  const b=$('settings');b.textContent='';
  b.append(h('h2',{},'Salir de la lista'),h('p',{cls:'note'},'Dejarás de ver esta lista. Podrás volver con el código.'),h('button',{onclick:async()=>{const c=cur;cur=null;showCfg=false;try{await db.collection('members').doc(mid(c,session.uid)).delete()}catch(e){}render()}},'Salir'),' ',h('button',{cls:'ghost',onclick:()=>{showCfg=false;render()}},'Cancelar'));
}

async function delList(){
  const c=cur;cur=null;confirmDel=false;showCfg=false;
  try{
    await Promise.all(items.filter(i=>i.list===c).map(i=>db.collection('items').doc(i.id).delete()));
    await Promise.all(members.filter(m=>m.code===c).map(m=>db.collection('members').doc(mid(c,m.user)).delete()));
    await db.collection('lists').doc(c).delete();
  }catch(e){}
  render();
}

async function addItem(){
  const inp=$('nt'),text=inp.value.trim();$('lerr').textContent='';
  if(!text)return;
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await db.collection('items').doc(id).set({list:cur,text,done:false,by:session.uid,ts:Date.now()});inp.value=''}
  catch(e){$('lerr').textContent='No se pudo añadir.'}
}

function render(){
  if(!ready)return;
  $('auth').hidden=!!session;$('app').hidden=!session;
  if(!session)return;
  $('me').textContent=nameOf(session.uid);
  $('acct').hidden=!acctOpen;
  $('home').hidden=acctOpen||!!cur;$('listv').hidden=acctOpen||!cur;
  if(acctOpen)return;
  if(cur)renderList();else renderHome();
}

async function start(){
  try{Object.assign(prefs,JSON.parse(localStorage.getItem('lc_prefs')||'{}'))}catch(e){}
  applyPrefs();session=lsGet();
  if(session&&session.key){try{const sn=await db.collection('logins').doc(session.key).get();if(!sn.exists||sn.data().hash!==session.hash){session=null;lsSet(null)}}catch(e){}}else{session=null;lsSet(null)}
  const got={};
  const fin=k=>{got[k]=1;if(got.a&&got.l&&got.m&&got.i){ready=true;clearTimeout(timer);$('msg').hidden=true}render()};
  const timer=setTimeout(()=>{if(!ready)$('msg').textContent='La conexión tarda más de lo normal. Recarga la página.'},10000);
  const fail=()=>{$('msg').textContent='No se pudieron cargar los datos.'};
  db.collection('profiles').onSnapshot(s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data());
    const p=session&&profiles[session.uid];if(p&&((p.theme||'auto')!==prefs.theme||(p.style||'classic')!==prefs.style)){prefs.theme=p.theme||'auto';prefs.style=p.style||'classic';applyPrefs()}
    fin('a')},fail);
  db.collection('lists').onSnapshot(s=>{lists={};s.docs.forEach(d=>lists[d.id]=d.data());fin('l')},fail);
  db.collection('members').onSnapshot(s=>{members=s.docs.map(d=>d.data());fin('m')},fail);
  db.collection('items').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.ts||0)-(y.ts||0));fin('i')},fail);
}

$('tLogin').onclick=()=>setMode('login');$('tReg').onclick=()=>setMode('reg');
$('go').onclick=submitAuth;
['u','p','dn'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth()}));
$('nt').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
$('newName').addEventListener('keydown',e=>{if(e.key==='Enter')createList()});
$('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinList()});
$('add').onclick=addItem;$('create').onclick=createList;$('join').onclick=joinList;
$('back').onclick=()=>{cur=null;showCfg=false;confirmDel=false;render()};
$('cfg').onclick=()=>{showCfg=!showCfg;confirmDel=false;render()};
$('copy').onclick=()=>{try{navigator.clipboard.writeText(cur);$('copy').textContent='¡Copiado!';setTimeout(()=>$('copy').textContent='Copiar',1500)}catch(e){}};
$('ren').onclick=()=>{if(acctOpen){acctOpen=false;render()}else openAcct()};
$('out').onclick=()=>{session=null;cur=null;acctOpen=false;lsSet(null);render()};

(async()=>{
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){$('msg').textContent='Inicia sesión en Claude para usar las listas compartidas.';return}
  start();
})();
})();
</script>
</body>
</html>
